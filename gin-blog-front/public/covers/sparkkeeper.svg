<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="ui-monospace,Consolas,monospace">
  <!-- SparkKeeper · 封面 (终端风/green 火花续火) -->
  <defs>
    <linearGradient id="sk-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1410"/>
      <stop offset="1" stop-color="#0f1a16"/>
    </linearGradient>
    <radialGradient id="sk-glow" cx="0.72" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#sk-bg)"/>
  <rect width="800" height="450" fill="url(#sk-glow)"/>
  <!-- 终端窗 -->
  <rect x="60" y="70" width="450" height="250" rx="14" fill="#08100d" stroke="#34d399" stroke-opacity="0.35"/>
  <circle cx="88" cy="98" r="6" fill="#ff5f57"/>
  <circle cx="110" cy="98" r="6" fill="#febc2e"/>
  <circle cx="132" cy="98" r="6" fill="#28c840"/>
  <text x="88" y="150" fill="#34d399" font-size="17">$ sparkkeeper cron --every 6h</text>
  <text x="88" y="180" fill="#a7e8cd" font-size="15">🔥 好友A · 火花已续 +1</text>
  <text x="88" y="208" fill="#a7e8cd" font-size="15">🔥 好友B · 火花已续 +1</text>
  <text x="88" y="236" fill="#6aa88f" font-size="15">next run in 05:42:11</text>
  <rect x="88" y="256" width="10" height="18" fill="#34d399">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <!-- 火焰 -->
  <g transform="translate(610,150) scale(3.2)">
    <path d="M12 2c1 4-4 5-4 9a4 4 0 008 0c0-1.5-.7-2.6-1.5-3.6-.5 1-1.2 1.4-1.7 1.6.8-2.2-.2-5.2-.8-7z" fill="#fbbf24"/>
    <path d="M12 8c.4 2-2 2.6-2 4.6a2 2 0 004 0c0-1.6-1.4-2.6-2-4.6z" fill="#f97316"/>
  </g>
  <!-- 标签 -->
  <rect x="60" y="356" width="130" height="30" rx="15" fill="#34d399" fill-opacity="0.1" stroke="#34d399" stroke-opacity="0.4"/>
  <text x="125" y="376" fill="#6ee7b7" font-size="15" text-anchor="middle">TypeScript</text>
  <rect x="200" y="356" width="120" height="30" rx="15" fill="#34d399" fill-opacity="0.1" stroke="#34d399" stroke-opacity="0.4"/>
  <text x="260" y="376" fill="#6ee7b7" font-size="15" text-anchor="middle">Playwright</text>
  <rect x="330" y="356" width="110" height="30" rx="15" fill="#34d399" fill-opacity="0.1" stroke="#34d399" stroke-opacity="0.4"/>
  <text x="385" y="376" fill="#6ee7b7" font-size="15" text-anchor="middle">React</text>
  <rect x="450" y="356" width="130" height="30" rx="15" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-opacity="0.4"/>
  <text x="515" y="376" fill="#fcd34d" font-size="15" text-anchor="middle">本地优先</text>
  <text x="740" y="416" fill="#4f7a68" font-size="14" text-anchor="end">SparkKeeper · by DKXaiLBY</text>
</svg>
