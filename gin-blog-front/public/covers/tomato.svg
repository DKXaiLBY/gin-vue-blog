<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="ui-monospace,Consolas,monospace">
  <!-- Tomato 番茄专注 · 封面 (终端风/red 番茄钟) -->
  <defs>
    <linearGradient id="tm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#180d0d"/>
      <stop offset="1" stop-color="#201114"/>
    </linearGradient>
    <radialGradient id="tm-glow" cx="0.68" cy="0.28" r="0.9">
      <stop offset="0" stop-color="#f87171" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#f87171" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#f87171" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#tm-bg)"/>
  <rect width="800" height="450" fill="url(#tm-glow)"/>
  <!-- 终端窗 -->
  <rect x="60" y="70" width="440" height="250" rx="14" fill="#120a0b" stroke="#f87171" stroke-opacity="0.35"/>
  <circle cx="88" cy="98" r="6" fill="#ff5f57"/>
  <circle cx="110" cy="98" r="6" fill="#febc2e"/>
  <circle cx="132" cy="98" r="6" fill="#28c840"/>
  <text x="88" y="150" fill="#f87171" font-size="17">$ tomato start --focus 25m</text>
  <text x="88" y="180" fill="#f3b4b4" font-size="15">🍅 专注中 · 剩余 18:32</text>
  <text x="88" y="208" fill="#f3b4b4" font-size="15">🎵 白噪音 · 雨声 40%</text>
  <text x="88" y="236" fill="#a87070" font-size="15">今日 6 番茄 · 连续 12 天</text>
  <rect x="88" y="256" width="10" height="18" fill="#f87171">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <!-- 番茄 + 计时环 -->
  <g transform="translate(630,200)">
    <circle r="62" fill="none" stroke="#2a1517" stroke-width="10"/>
    <circle r="62" fill="none" stroke="#f87171" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="389" stroke-dashoffset="110" transform="rotate(-90)"/>
    <text y="-16" font-size="44" text-anchor="middle">🍅</text>
    <text y="30" fill="#f87171" font-size="16" text-anchor="middle">25:00</text>
  </g>
  <!-- 标签 -->
  <rect x="60" y="356" width="120" height="30" rx="15" fill="#f87171" fill-opacity="0.1" stroke="#f87171" stroke-opacity="0.4"/>
  <text x="120" y="376" fill="#fca5a5" font-size="15" text-anchor="middle">Android</text>
  <rect x="190" y="356" width="130" height="30" rx="15" fill="#f87171" fill-opacity="0.1" stroke="#f87171" stroke-opacity="0.4"/>
  <text x="255" y="376" fill="#fca5a5" font-size="15" text-anchor="middle">沉浸专注舱</text>
  <rect x="330" y="356" width="120" height="30" rx="15" fill="#f87171" fill-opacity="0.1" stroke="#f87171" stroke-opacity="0.4"/>
  <text x="390" y="376" fill="#fca5a5" font-size="15" text-anchor="middle">白噪音</text>
  <rect x="460" y="356" width="120" height="30" rx="15" fill="#f87171" fill-opacity="0.1" stroke="#f87171" stroke-opacity="0.4"/>
  <text x="520" y="376" fill="#fca5a5" font-size="15" text-anchor="middle">数据统计</text>
  <text x="740" y="416" fill="#7a4a4a" font-size="14" text-anchor="end">Tomato · by DKXaiLBY</text>
</svg>
