<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="ui-monospace,Consolas,monospace">
  <!-- LoveGirl · 情侣互动 App 封面 (终端风/pink) -->
  <defs>
    <linearGradient id="lg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#160f1d"/>
      <stop offset="1" stop-color="#1e1428"/>
    </linearGradient>
    <radialGradient id="lg-glow" cx="0.7" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#f472b6" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#lg-bg)"/>
  <rect width="800" height="450" fill="url(#lg-glow)"/>
  <!-- 终端窗 -->
  <rect x="60" y="70" width="440" height="250" rx="14" fill="#0d0a12" stroke="#f472b6" stroke-opacity="0.35"/>
  <circle cx="88" cy="98" r="6" fill="#ff5f57"/>
  <circle cx="110" cy="98" r="6" fill="#febc2e"/>
  <circle cx="132" cy="98" r="6" fill="#28c840"/>
  <text x="88" y="150" fill="#f472b6" font-size="17">$ lovegirl --status</text>
  <text x="88" y="180" fill="#e8b7d2" font-size="15">❤ 在一起的第 483 天</text>
  <text x="88" y="208" fill="#e8b7d2" font-size="15">👗 衣柜 · 🗺 旅行地图 · 📸 相册</text>
  <text x="88" y="236" fill="#e8b7d2" font-size="15">build 179 · flutter</text>
  <rect x="88" y="256" width="10" height="18" fill="#f472b6">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <!-- 双心 -->
  <g transform="translate(600,190) scale(2.6)" fill="#f472b6">
    <path d="M12 21s-7-4.6-9.5-8.5C.6 9.6 2.2 5.5 6 5.5c2 0 3.4 1 4 2.2.6-1.2 2-2.2 4-2.2 3.8 0 5.4 4.1 3.5 7-2.5 3.9-9.5 8.5-9.5 8.5z"/>
    <path transform="translate(-13,-11) scale(0.55)" d="M12 21s-7-4.6-9.5-8.5C.6 9.6 2.2 5.5 6 5.5c2 0 3.4 1 4 2.2.6-1.2 2-2.2 4-2.2 3.8 0 5.4 4.1 3.5 7-2.5 3.9-9.5 8.5-9.5 8.5z" fill="#fb7185" opacity="0.85"/>
  </g>
  <!-- 底部标签 -->
  <rect x="60" y="356" width="120" height="30" rx="15" fill="#f472b6" fill-opacity="0.12" stroke="#f472b6" stroke-opacity="0.4"/>
  <text x="120" y="376" fill="#f9a8d4" font-size="15" text-anchor="middle">Flutter</text>
  <rect x="190" y="356" width="110" height="30" rx="15" fill="#f472b6" fill-opacity="0.12" stroke="#f472b6" stroke-opacity="0.4"/>
  <text x="245" y="376" fill="#f9a8d4" font-size="15" text-anchor="middle">Node.js</text>
  <rect x="310" y="356" width="100" height="30" rx="15" fill="#f472b6" fill-opacity="0.12" stroke="#f472b6" stroke-opacity="0.4"/>
  <text x="360" y="376" fill="#f9a8d4" font-size="15" text-anchor="middle">MySQL</text>
  <text x="740" y="416" fill="#6b5a70" font-size="14" text-anchor="end">LoveGirl · by DKXaiLBY</text>
</svg>
