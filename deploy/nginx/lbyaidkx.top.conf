# lbyaidkx.top · 阶段一: 80 端口 ACME 验证路径 (v3.49)
# 说明: 域名请求在此块命中(精确 server_name 优先于 gvb-blog.conf 的 default_server),
# 其余(含 IP 直访)继续走 gvb-blog.conf 的 default_server, IP 访问不受影响。
# 签发证书后由阶段二配置接管(增加 301 跳转与 443)。

server {
    listen 80;
    server_name lbyaidkx.top www.lbyaidkx.top;

    # ACME HTTP-01 验证路径
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/well-known/lbyaidkx.top;
        default_type "text/plain";
    }

    # 其余请求仍走 HTTP 反代(阶段一不跳转, 避免证书就位前出现死链)
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
